<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
      }
      .card {
        width: 1200px;
        height: 630px;
        position: relative;
        overflow: hidden;
        background: #fafafa;
        color: #0f172a;
        font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
        letter-spacing: -0.025em;
      }
      .card::before {
        content: '';
        position: absolute;
        inset: 0;
        opacity: 0.55;
        background-image:
          radial-gradient(circle at 0 0, rgba(15, 23, 42, 0.06) 0, transparent 55%),
          radial-gradient(circle at 100% 0, rgba(15, 23, 42, 0.05) 0, transparent 55%),
          repeating-linear-gradient(
            45deg,
            rgba(148, 163, 184, 0.12) 0,
            rgba(148, 163, 184, 0.12) 1px,
            transparent 1px,
            transparent 4px
          );
      }
      .grad {
        --m-grad: linear-gradient(90deg, #fcaf45 0%, #fbab46 25%, #e1306c 50%, #833ab4 75%, #833ab4 100%);
      }
      .nav {
        position: absolute;
        top: 36px;
        left: 50%;
        transform: translateX(-50%);
        width: 920px;
        height: 64px;
        background: #000;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 18px 0 16px;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.28);
        z-index: 2;
      }
      .nav img {
        height: 40px;
        width: auto;
        object-fit: contain;
        border-radius: 14px;
        background: #000;
        padding: 4px;
      }
      .pill {
        background-image: var(--m-grad);
        color: #fff;
        font-size: 15px;
        font-weight: 800;
        border-radius: 999px;
        padding: 12px 22px;
      }
      .hero {
        position: relative;
        z-index: 1;
        padding: 132px 64px 36px 72px;
        display: grid;
        grid-template-columns: 1fr 420px;
        gap: 48px;
        height: 100%;
        box-sizing: border-box;
        align-items: center;
      }
      .copy h1 {
        margin: 0;
        font-size: 64px;
        line-height: 0.98;
        font-weight: 900;
        letter-spacing: -0.05em;
        color: #000;
      }
      .mark {
        position: relative;
        display: inline-block;
      }
      .mark::after {
        content: '';
        position: absolute;
        left: 0;
        bottom: 2px;
        width: 100%;
        height: 10px;
        border-radius: 999px;
        background-image: var(--m-grad);
        z-index: -1;
      }
      .lead {
        margin: 22px 0 0;
        max-width: 440px;
        color: #334155;
        font-size: 22px;
        font-weight: 500;
        line-height: 1.4;
        letter-spacing: -0.02em;
      }

      /* Single Instagram post, solid edges, no mask / no outer glow */
      .post {
        width: 420px;
        height: 420px;
        justify-self: end;
        border-radius: 28px;
        overflow: hidden;
        position: relative;
        background: #000;
        box-shadow: 0 22px 48px rgba(15, 23, 42, 0.18);
      }
      .post-photo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 18%;
        display: block;
      }
      .post-type {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 2;
        padding: 80px 22px 24px;
        /* Solid black floor so nothing ghosts through */
        background: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, #000 42%, #000 100%);
        color: #fff;
        font-weight: 900;
        letter-spacing: -0.05em;
        text-transform: uppercase;
      }
      .badge {
        display: inline-block;
        background: #fff;
        color: #000;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.06em;
        padding: 4px 8px;
        border-radius: 3px;
        margin-bottom: 10px;
      }
      .line {
        display: block;
        font-size: 36px;
        line-height: 0.95;
      }
      .line-2 {
        margin-top: 2px;
        font-size: 36px;
        line-height: 0.95;
        white-space: nowrap;
      }
      .word-orange {
        color: #ff7a18;
      }
      .word-blue {
        color: #fbad45;
      }
      .sel {
        background: #fbad45;
        color: #111;
        border-radius: 2px;
        padding: 1px 3px;
      }
      .caret {
        display: inline-block;
        width: 3px;
        height: 32px;
        margin: 0 2px -5px;
        background: #fff;
        border-radius: 1px;
        vertical-align: baseline;
        position: relative;
        box-shadow: 0 0 8px rgba(251, 173, 69, 0.95);
      }
      .caret::before,
      .caret::after {
        content: '';
        position: absolute;
        left: -4px;
        width: 11px;
        height: 2.5px;
        background: #fff;
        border-radius: 1px;
      }
      .caret::before {
        top: -1px;
      }
      .caret::after {
        bottom: -1px;
      }
      .sub {
        margin: 10px 0 0;
        max-width: 260px;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: -0.01em;
        text-transform: none;
        color: rgba(255, 255, 255, 0.78);
        line-height: 1.35;
      }
      .handle {
        position: absolute;
        z-index: 4;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: #fbad45;
        border: 2.5px solid #fff;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
      }
      .handle-l {
        left: 20px;
        bottom: 86px;
      }
      .handle-r {
        left: 178px;
        bottom: 86px;
      }
      .cursor {
        position: absolute;
        left: 190px;
        bottom: 58px;
        z-index: 5;
        width: 24px;
        height: 24px;
        filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.45));
      }
    </style>
  </head>
  <body class="grad">
    <div class="card">
      <div class="nav">
        <img src="../public/logo.png" alt="Instatools" />
        <div class="pill">Try now</div>
      </div>
      <div class="hero">
        <div class="copy">
          <h1>
            Free Instagram<br />
            Post Maker for<br />
            <span class="mark">creators.</span>
          </h1>
          <p class="lead">
            Pick a layout, edit the photo and headline, export HD PNG on your device.
          </p>
        </div>

        <div class="post" aria-hidden="true">
          <img class="post-photo" src="../public/demo/aaron-jones.jpg" alt="" />
          <div class="post-type">
            <span class="badge">NEWS</span>
            <span class="line">Obama claims</span>
            <span class="line-2">
              <span class="sel word-orange">Aliens</span><span class="caret"></span>
              <span class="word-blue">are real</span>
            </span>
            <p class="sub">He also denied that they're being held at Area 51</p>
          </div>
          <div class="handle handle-l"></div>
          <div class="handle handle-r"></div>
          <svg class="cursor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M5.5 3.2L18.2 12.1L12.4 13.4L9.8 20.8L5.5 3.2Z"
              fill="#fff"
              stroke="#0f172a"
              stroke-width="1.4"
              stroke-linejoin="round"
            />
          </svg>
        </div>
      </div>
    </div>
  </body>
</html>
