<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; }
      .card {
        width: 1200px;
        height: 630px;
        position: relative;
        overflow: hidden;
        background: #fafafa;
        color: #0f172a;
        font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
        letter-spacing: -0.025em;
      }
      .card::before {
        content: '';
        position: absolute;
        inset: 0;
        opacity: 0.55;
        background-image:
          radial-gradient(circle at 0 0, rgba(15, 23, 42, 0.06) 0, transparent 55%),
          radial-gradient(circle at 100% 0, rgba(15, 23, 42, 0.05) 0, transparent 55%),
          repeating-linear-gradient(45deg, rgba(148, 163, 184, 0.12) 0, rgba(148, 163, 184, 0.12) 1px, transparent 1px, transparent 4px);
      }
      .grad {
        --m-grad: linear-gradient(90deg, #fcaf45 0%, #fbab46 25%, #e1306c 50%, #833ab4 75%, #833ab4 100%);
      }
      .nav {
        position: absolute;
        top: 36px;
        left: 50%;
        transform: translateX(-50%);
        width: 920px;
        height: 64px;
        background: #000;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 18px 0 16px;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.28);
        z-index: 2;
      }
      .nav img {
        height: 40px;
        width: auto;
        object-fit: contain;
        border-radius: 14px;
        background: #000;
        padding: 4px;
      }
      .pill {
        background-image: var(--m-grad);
        color: #fff;
        font-size: 15px;
        font-weight: 800;
        border-radius: 999px;
        padding: 12px 22px;
      }
      .hero {
        position: relative;
        z-index: 1;
        padding: 140px 72px 48px;
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        gap: 36px;
        height: 100%;
        box-sizing: border-box;
      }
      .copy h1 {
        margin: 0;
        font-size: 64px;
        line-height: 0.98;
        font-weight: 900;
        letter-spacing: -0.05em;
        color: #000;
      }
      .mark {
        position: relative;
        display: inline-block;
      }
      .mark::after {
        content: '';
        position: absolute;
        left: 0;
        bottom: 2px;
        width: 100%;
        height: 10px;
        border-radius: 999px;
        background-image: var(--m-grad);
        z-index: -1;
      }
      .lead {
        margin: 22px 0 0;
        max-width: 460px;
        color: #334155;
        font-size: 22px;
        font-weight: 500;
        line-height: 1.4;
        letter-spacing: -0.02em;
      }
      .meta {
        margin-top: 28px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .chip {
        border: 1px solid rgba(15, 23, 42, 0.1);
        background: rgba(255, 255, 255, 0.8);
        border-radius: 999px;
        padding: 10px 14px;
        font-size: 14px;
        font-weight: 700;
        color: #0f172a;
      }
      .stage {
        align-self: end;
        justify-self: end;
        width: 100%;
        height: 430px;
        background: #000;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 36px;
        padding: 18px;
        box-sizing: border-box;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        box-shadow: 0 28px 70px rgba(0, 0, 0, 0.28);
        position: relative;
        overflow: hidden;
      }
      .stage::before {
        content: '';
        position: absolute;
        inset: -20%;
        background:
          radial-gradient(circle at top left, rgba(239, 68, 68, 0.16), transparent 55%),
          radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.14), transparent 55%);
        opacity: 0.7;
        mix-blend-mode: screen;
        pointer-events: none;
      }
      .thumb {
        position: relative;
        z-index: 1;
        border-radius: 18px;
        overflow: hidden;
        background: #111;
      }
      .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .thumb:nth-child(1) { grid-row: 1 / 3; }
      .thumb:nth-child(2) { height: 190px; }
      .thumb:nth-child(3) { height: 190px; }
      .thumb:nth-child(4) { height: 190px; }
      .thumb:nth-child(5) { height: 190px; }
    </style>
  </head>
  <body class="grad">
    <div class="card">
      <div class="nav">
        <img src="../public/logo.png" alt="Instatools" />
        <div class="pill">Try now</div>
      </div>
      <div class="hero">
        <div class="copy">
          <h1>
            Free Instagram<br />
            Post Maker for<br />
            <span class="mark">creators.</span>
          </h1>
          <p class="lead">
            Pick a layout, edit the photo and headline, export HD PNG on your device.
          </p>
          <div class="meta">
            <span class="chip">14 layouts</span>
            <span class="chip">Local HD export</span>
            <span class="chip">No signup</span>
          </div>
        </div>
        <div class="stage">
          <div class="thumb"><img src="../public/themes/cards/template1.png" alt="" /></div>
          <div class="thumb"><img src="../public/themes/cards/template3.png" alt="" /></div>
          <div class="thumb"><img src="../public/themes/cards/template14.png" alt="" /></div>
          <div class="thumb"><img src="../public/themes/cards/template13.png" alt="" /></div>
          <div class="thumb"><img src="../public/themes/cards/template7.png" alt="" /></div>
        </div>
      </div>
    </div>
  </body>
</html>
